<div class="b" id="box"><h1>SAP SD Courses</h1><p>Loading&hellip;</p></div>
<script>
// Sign-in page for the SAP SD Courses (sign-in-page-v1).
// The courses are not in this file: after sign-in they are loaded from the course service.
var API="https://course-results.infrabeatsd.workers.dev";
var KEY="ibcToken";
function getT(){try{return localStorage.getItem(KEY);}catch(e){return null;}}
function setT(t){try{if(t)localStorage.setItem(KEY,t);else localStorage.removeItem(KEY);}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var box=document.getElementById("box");
function learnerForm(msg,typed){
  box.innerHTML='<h1>SAP SD Courses</h1><p>These courses are for Infrabeat staff who have been given access by the trainer.</p>'+
    (msg?'<p class="bad">'+esc(msg)+'</p>':'')+
    '<form id="f"><label for="w">Your first name or full name</label><input id="w" autocomplete="name" placeholder="e.g. Riya or Riya Sharma" value="'+esc(typed||"")+'">'+
    '<button id="go" type="submit">Open the courses</button></form>'+
    '<p class="s">This browser remembers you after the first time. Not on the list yet? Please ask your trainer.</p>'+
    '<p class="s"><a href="?trainer">Trainer sign-in</a></p>';
  var w=document.getElementById("w");w.focus();
  document.getElementById("f").onsubmit=function(e){e.preventDefault();var v=w.value.trim();if(v.length<2){learnerForm("Please type your first name or full name.",v);return;}
    var b=document.getElementById("go");b.disabled=true;b.textContent="Checking\u2026";
    post("/api/signin",{who:v}).then(function(j){if(j&&j.ok){setT(j.token);loadCourse();}else{learnerForm((j&&j.why)||"Could not sign in.",v);}},
      function(){learnerForm("The course service could not be reached. Check your internet connection and try again.",v);});};
}
function trainerForm(msg){
  box.innerHTML='<h1>Trainer sign-in</h1>'+(msg?'<p class="bad">'+esc(msg)+'</p>':"<p>Sign in to see learners' progress and to give or remove access.</p>")+
    '<form id="f"><label for="u">User name</label><input id="u" value="Trainer" autocomplete="username">'+
    '<label for="p">Password</label><input id="p" type="password" autocomplete="current-password">'+
    '<button id="go" type="submit">Sign in</button></form><p class="s"><a href="'+location.pathname+'">Back to learner sign-in</a></p>';
  document.getElementById("p").focus();
  document.getElementById("f").onsubmit=function(e){e.preventDefault();var b=document.getElementById("go");b.disabled=true;b.textContent="Checking\u2026";
    post("/api/trainer",{user:document.getElementById("u").value,password:document.getElementById("p").value}).then(function(j){
      if(j&&j.ok){setT(j.token);history.replaceState(null,"",location.pathname+"#trainer");loadCourse();}else{trainerForm((j&&j.why)||"Could not sign in.");}},
      function(){trainerForm("The course service could not be reached. Check your internet connection and try again.");});};
}
function post(path,body){
  return fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json();});
}
function loadCourse(){
  box.innerHTML='<h1>SAP SD Courses</h1><p>Opening the courses&hellip;</p>';
  fetch(API+"/app",{headers:{Authorization:"Bearer "+getT()},cache:"no-store"}).then(function(r){
    if(r.status===200)return r.text().then(function(h){document.open();document.write(h);document.close();});
    setT(null);learnerForm(r.status===401?"":"Your access has ended or changed. Please sign in again, or ask your trainer.");
  },function(){box.innerHTML='<h1>SAP SD Courses</h1><p class="bad">The course service could not be reached. Check your internet connection and reload the page.</p>';});
}
if(/[?&]trainer/.test(location.search)){setT(null);trainerForm("");}
else if(getT()){loadCourse();}
else{learnerForm("","");}
</script>
